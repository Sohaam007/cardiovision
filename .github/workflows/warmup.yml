name: Render API Keep-Warm Ping

on:
  schedule:
    # Trigger every 10 minutes
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      manual_override:
        description: 'Force run ping even if WARMUP_ENABLED is not set'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  ping-health:
    name: Ping API Health Endpoint
    runs-on: ubuntu-latest
    steps:
      - name: Check Warm-Up Flag
        id: check
        run: |
          # Only run if explicitly enabled via repo secret/variable WARMUP_ENABLED=true or manual override
          if [ "${{ vars.WARMUP_ENABLED }}" = "true" ] || [ "${{ github.event.inputs.manual_override }}" = "true" ]; then
            echo "enabled=true" >> $GITHUB_OUTPUT
          else
            echo "Warm-up cron is currently disabled. Set GitHub Actions variable WARMUP_ENABLED=true to activate during judging."
            echo "enabled=false" >> $GITHUB_OUTPUT
          fi

      - name: Send Health Ping to Render
        if: steps.check.outputs.enabled == 'true'
        run: |
          API_URL="${{ vars.LIVE_API_URL || 'https://cardiovision-api.onrender.com' }}"
          echo "Pinging health endpoint at $API_URL/health ..."
          RESPONSE=$(curl -s -w "\n%{http_code}" --max-time 15 "$API_URL/health")
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | head -n -1)
          echo "Response code: $HTTP_CODE"
          echo "Body: $BODY"
          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "Health check returned non-200 status: $HTTP_CODE"
            exit 1
          fi
          echo "API is warm and operational."
