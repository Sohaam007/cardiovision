name: CI (Fast Automated Verification)

on:
  push:
    branches: [ main, ops/* ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-and-ml:
    name: Backend & ML Tests (Pytest + Zero Leakage)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Pinned Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Zero Production SHAP Dependency
        run: |
          ! python -c "import sys; sys.path.insert(0, '.'); import api.main; import shap" 2>/dev/null || (echo "SHAP must never be imported in production" && exit 1)

      - name: Run Pytest Suite (Zero Leakage + Contract + Parity)
        run: |
          pytest -v

  frontend:
    name: Frontend Quality (Typecheck + Tests + Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run TypeScript Strict Typecheck (Lint)
        run: npm run lint

      - name: Run Unit & Integration Test Suite
        run: npm test

      - name: Run Production Bundle Build (Vite)
        run: npm run build
