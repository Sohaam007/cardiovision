services:
  - type: web
    name: cardiovision-api
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: MOCK_MODE
        value: "0"
      - key: CORS_ORIGINS
        value: "http://localhost:5173,https://cardiovision-sigma.vercel.app"
