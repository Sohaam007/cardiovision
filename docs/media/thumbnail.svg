<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="50%" stop-color="#091024" />
      <stop offset="100%" stop-color="#0e172e" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="heartGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#991b1b" />
      <stop offset="40%" stop-color="#b91c1c" />
      <stop offset="70%" stop-color="#7f1d1d" />
      <stop offset="100%" stop-color="#450a0a" />
    </linearGradient>

    <linearGradient id="aortaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>

    <linearGradient id="pulmGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Filters & Glows -->
    <filter id="neonCyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="neonCrimsonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="neonEmeraldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="dropShadowCard" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.7" />
    </filter>

    <!-- Medical Isometric Grid Pattern -->
    <pattern id="medicalGrid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#1e293b" stroke-width="0.75" opacity="0.35" />
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1920" height="1080" fill="url(#bgGrad)" />
  <rect width="1920" height="1080" fill="url(#medicalGrid)" />

  <!-- Ambient Light Orbs -->
  <circle cx="200" cy="150" r="450" fill="#0284c7" opacity="0.12" filter="blur(80px)" />
  <circle cx="1550" cy="480" r="500" fill="#ef4444" opacity="0.16" filter="blur(90px)" />
  <circle cx="1300" cy="750" r="420" fill="#10b981" opacity="0.14" filter="blur(75px)" />
  <circle cx="950" cy="950" r="400" fill="#a855f7" opacity="0.12" filter="blur(80px)" />

  <!-- LEFT SECTION: Typography & Information Architecture -->
  <g transform="translate(80, 80)">
    <!-- Top Metadata Header Badges -->
    <g transform="translate(0, 0)">
      <!-- Hackathon Track Pill -->
      <rect x="0" y="0" width="560" height="52" rx="26" fill="#0f172a" stroke="#38bdf8" stroke-width="2" opacity="0.95" />
      <text x="28" y="33" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="21" font-weight="800" letter-spacing="1.5">
        MULTIMODAL AI HACKATHON 2026 • TRACK A
      </text>

      <!-- TEAM Lv. 9 Pill Badge (Golden Neon) -->
      <g transform="translate(580, 0)">
        <rect x="0" y="0" width="300" height="52" rx="26" fill="url(#goldGrad)" stroke="#fef08a" stroke-width="2" filter="url(#dropShadowCard)" />
        <text x="24" y="34" fill="#090d16" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="900" letter-spacing="2">
          ★ TEAM: Lv. 9 ★
        </text>
      </g>

      <!-- NANO-BANANA Core Badge -->
      <g transform="translate(900, 0)">
        <rect x="0" y="0" width="310" height="52" rx="26" fill="url(#purpleGrad)" stroke="#d8b4fe" stroke-width="2" />
        <!-- Stylized Nano-Banana Curved Icon -->
        <path d="M 28 34 Q 38 16 52 24 Q 40 38 28 34 Z" fill="#facc15" stroke="#fde047" stroke-width="1.5" />
        <circle cx="53" cy="23" r="2.5" fill="#ca8a04" />
        <text x="64" y="33" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="21" font-weight="800" letter-spacing="1">
          NANO-BANANA CORE
        </text>
      </g>
    </g>

    <!-- Main Project Branding -->
    <g transform="translate(0, 150)">
      <!-- Massive Title with Glow -->
      <text x="0" y="0" fill="url(#titleGrad)" font-family="system-ui, -apple-system, sans-serif" font-size="112" font-weight="900" letter-spacing="-1.5" filter="drop-shadow(0 8px 16px rgba(0,0,0,0.8))">
        CARDIOVISION
      </text>
      
      <!-- Subtitle -->
      <text x="4" y="55" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="700" letter-spacing="2">
        3D CARDIAC DIGITAL TWIN &amp; MULTIMODAL RISK AI
      </text>

      <text x="4" y="98" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="500">
        Non-Invasive CAD &amp; Vessel-Specific Stenosis Prediction (LAD • LCX • RCA)
      </text>
    </g>

    <!-- Key Metrics & Engineering Highlights -->
    <g transform="translate(0, 310)">
      <!-- Pill 1: ROC-AUC -->
      <rect x="0" y="0" width="260" height="64" rx="14" fill="#09141e" stroke="#10b981" stroke-width="2.5" />
      <text x="20" y="27" fill="#6ee7b7" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700">CAD DISCRIMINATION</text>
      <text x="20" y="52" fill="#10b981" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="900">0.9026 ROC-AUC</text>

      <!-- Pill 2: Native TreeSHAP -->
      <rect x="280" y="0" width="270" height="64" rx="14" fill="#140f28" stroke="#a855f7" stroke-width="2.5" />
      <text x="20" y="27" transform="translate(280,0)" fill="#d8b4fe" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700">SUB-25MS EXPLAINABILITY</text>
      <text x="20" y="52" transform="translate(280,0)" fill="#c084fc" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="900">Native TreeSHAP</text>

      <!-- Pill 3: Zero Leakage Invariant -->
      <rect x="570" y="0" width="280" height="64" rx="14" fill="#0f1928" stroke="#0ea5e9" stroke-width="2.5" />
      <text x="20" y="27" transform="translate(570,0)" fill="#7dd3fc" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700">AUTOMATED VERIFICATION</text>
      <text x="20" y="52" transform="translate(570,0)" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="900">Zero-Leakage Invariant</text>
    </g>

    <!-- Glassmorphic Feature Preview Card (Clinical Dashboard & What-If) -->
    <g transform="translate(0, 420)" filter="url(#dropShadowCard)">
      <rect x="0" y="0" width="850" height="380" rx="20" fill="#070b14" stroke="#1e293b" stroke-width="2" opacity="0.95" />
      
      <!-- Card Header -->
      <rect x="0" y="0" width="850" height="48" rx="20" fill="#0f172a" />
      <circle cx="28" cy="24" r="6" fill="#ef4444" />
      <circle cx="48" cy="24" r="6" fill="#f59e0b" />
      <circle cx="68" cy="24" r="6" fill="#10b981" />
      <text x="96" y="30" fill="#94a3b8" font-family="monospace" font-size="15" font-weight="600">
        cardiovision-sigma.vercel.app • Real-Time Clinical Workspace
      </text>

      <!-- Mock UI Telemetry Panels -->
      <g transform="translate(24, 68)">
        <!-- Patient Persona Info -->
        <rect x="0" y="0" width="380" height="130" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
        <text x="18" y="30" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="16" font-weight="700">Patient #002 (Isolated LAD Stenosis)</text>
        <text x="18" y="58" fill="#94a3b8" font-family="monospace" font-size="13">Age: 54 • BP: 100 mmHg • EF: 40%</text>
        <text x="18" y="82" fill="#94a3b8" font-family="monospace" font-size="13">Typical Chest Pain: Present (1)</text>
        <text x="18" y="108" fill="#ef4444" font-family="monospace" font-size="15" font-weight="800">LAD Severe Risk: 93.97% [Crimson]</text>

        <!-- Right Side: SHAP Drivers -->
        <rect x="400" y="0" width="400" height="130" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
        <text x="18" y="30" fill="#c084fc" font-family="system-ui, sans-serif" font-size="16" font-weight="700">Log-Odds TreeSHAP Waterfall</text>
        <!-- Horizontal SHAP Bars -->
        <text x="18" y="58" fill="#cbd5e1" font-family="monospace" font-size="12">Typical CP</text>
        <rect x="120" y="46" width="160" height="14" rx="4" fill="#f43f5e" />
        <text x="290" y="58" fill="#f43f5e" font-family="monospace" font-size="12" font-weight="700">+1.33</text>

        <text x="18" y="82" fill="#cbd5e1" font-family="monospace" font-size="12">Region RWMA</text>
        <rect x="120" y="70" width="95" height="14" rx="4" fill="#f43f5e" />
        <text x="225" y="82" fill="#f43f5e" font-family="monospace" font-size="12" font-weight="700">+0.68</text>

        <text x="18" y="106" fill="#cbd5e1" font-family="monospace" font-size="12">Normal ECG</text>
        <rect x="120" y="94" width="60" height="14" rx="4" fill="#14b8a6" />
        <text x="190" y="106" fill="#14b8a6" font-family="monospace" font-size="12" font-weight="700">-0.45</text>
      </g>

      <!-- Telemetry Oscilloscope Grid Section inside Card -->
      <g transform="translate(24, 218)">
        <rect x="0" y="0" width="802" height="130" rx="12" fill="#03080e" stroke="#065f46" stroke-width="1.5" />
        <text x="20" y="26" fill="#10b981" font-family="monospace" font-size="14" font-weight="700">
          ● ECG Lead II Telemetry • 75 BPM • Synchronized Cardiac Wiggers Cycle
        </text>

        <!-- Dynamic Continuous ECG Waveform -->
        <path d="M 20 80 
                 L 80 80 Q 95 68 110 80 L 130 80 
                 L 138 86 L 150 34 L 164 112 L 172 80 
                 L 190 80 Q 215 62 235 80 L 320 80
                 L 380 80 Q 395 68 410 80 L 430 80 
                 L 438 86 L 450 34 L 464 112 L 472 80 
                 L 490 80 Q 515 62 535 80 L 620 80
                 L 680 80 Q 695 68 710 80 L 730 80 
                 L 738 86 L 750 34 L 764 112 L 772 80 L 790 80"
              fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" filter="url(#neonEmeraldGlow)" />

        <!-- Sampling Phosphor Cursor -->
        <line x1="680" y1="20" x2="680" y2="120" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3 3" />
        <circle cx="680" cy="80" r="5" fill="#38bdf8" filter="url(#neonCyanGlow)" />
        <text x="695" y="42" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="700">LIVE SYNC</text>
      </g>
    </g>

    <!-- Bottom Action Pill: Watch Demo -->
    <g transform="translate(0, 830)">
      <rect x="0" y="0" width="540" height="64" rx="32" fill="#0284c7" stroke="#38bdf8" stroke-width="2" filter="url(#dropShadowCard)" />
      <polygon points="36,22 36,42 54,32" fill="#ffffff" />
      <text x="68" y="40" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="900" letter-spacing="1">
        WATCH 5-MIN SYSTEM DEMO VIDEO
      </text>
    </g>
  </g>

  <!-- RIGHT SECTION: Grand 3D Cardiac Anatomy Visual Model -->
  <g transform="translate(1420, 520)">
    <!-- Behind-Heart Pulsing Bio-Shield -->
    <circle cx="0" cy="0" r="380" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6 8" opacity="0.4" />
    <circle cx="0" cy="0" r="320" fill="none" stroke="#a855f7" stroke-width="2" stroke-dasharray="14 10" opacity="0.5" />
    <circle cx="0" cy="0" r="260" fill="none" stroke="#ef4444" stroke-width="1" opacity="0.3" />

    <!-- Aorta and Great Vessels -->
    <g transform="translate(0, -180)">
      <!-- Aortic Arch -->
      <path d="M -40 80 C -40 -40, 80 -60, 90 80" fill="none" stroke="url(#aortaGrad)" stroke-width="48" stroke-linecap="round" />
      <!-- Brachiocephalic, Carotid, Subclavian Branches -->
      <line x1="-15" y1="-20" x2="-25" y2="-70" stroke="url(#aortaGrad)" stroke-width="16" stroke-linecap="round" />
      <line x1="20" y1="-32" x2="20" y2="-76" stroke="url(#aortaGrad)" stroke-width="14" stroke-linecap="round" />
      <line x1="55" y1="-20" x2="65" y2="-68" stroke="url(#aortaGrad)" stroke-width="14" stroke-linecap="round" />

      <!-- Pulmonary Trunk -->
      <path d="M -70 90 C -70 20, 10 20, 20 90" fill="none" stroke="url(#pulmGrad)" stroke-width="36" stroke-linecap="round" />
    </g>

    <!-- Muscular Myocardium (Ventricular Body) -->
    <path d="M 0 -100
             C 140 -100, 230 -20, 220 120
             C 210 230, 90 320, 0 380
             C -90 320, -210 230, -220 120
             C -230 -20, -140 -100, 0 -100 Z"
          fill="url(#heartGrad)" stroke="#ef4444" stroke-width="3" filter="drop-shadow(0 24px 36px rgba(0,0,0,0.8))" />

    <!-- Sulcal Fat Pads & Base Contour -->
    <path d="M -160 30 Q -50 70 60 40 Q 150 10 180 50" fill="none" stroke="#fef08a" stroke-width="12" opacity="0.45" stroke-linecap="round" filter="blur(2px)" />

    <!-- 3D Coronary Arterial Tree (Color-Coded by Territory Risk!) -->
    <!-- Left Main Trunk -->
    <path d="M -20 -30 L -50 0" fill="none" stroke="#fbbf24" stroke-width="12" stroke-linecap="round" />

    <!-- LAD (Left Anterior Descending) - Crimson Red (93.97% Stenosis Risk) -->
    <path d="M -50 0 
             C -35 60, -10 140, 5 220
             C 15 270, 0 330, -10 360"
          fill="none" stroke="#ef4444" stroke-width="11" stroke-linecap="round" filter="url(#neonCrimsonGlow)" />

    <!-- LCX (Left Circumflex) - Amber / Moderate Risk (24.12%) -->
    <path d="M -50 0 
             C -110 30, -170 80, -185 150
             C -195 200, -170 250, -140 280"
          fill="none" stroke="#f59e0b" stroke-width="8" stroke-linecap="round" filter="url(#neonCyanGlow)" opacity="0.9" />

    <!-- RCA (Right Coronary Artery) - Emerald Green (27.75% Normal) -->
    <path d="M 30 -20
             C 110 0, 160 50, 170 120
             C 180 200, 140 260, 90 300
             C 50 330, 20 350, 5 365"
          fill="none" stroke="#10b981" stroke-width="9" stroke-linecap="round" filter="url(#neonEmeraldGlow)" />

    <!-- Arterial Branch Labels & Callout Tags -->
    <!-- LAD Tag -->
    <g transform="translate(30, 210)">
      <rect x="0" y="0" width="165" height="42" rx="10" fill="#450a0a" stroke="#ef4444" stroke-width="2" />
      <text x="14" y="27" fill="#fca5a5" font-family="monospace" font-size="14" font-weight="900">LAD: 93.97%</text>
    </g>

    <!-- LCX Tag -->
    <g transform="translate(-240, 140)">
      <rect x="0" y="0" width="160" height="42" rx="10" fill="#451a03" stroke="#f59e0b" stroke-width="2" />
      <text x="14" y="27" fill="#fde68a" font-family="monospace" font-size="14" font-weight="900">LCX: 24.12%</text>
    </g>

    <!-- RCA Tag -->
    <g transform="translate(170, 110)">
      <rect x="0" y="0" width="160" height="42" rx="10" fill="#064e3b" stroke="#10b981" stroke-width="2" />
      <text x="14" y="27" fill="#a7f3d0" font-family="monospace" font-size="14" font-weight="900">RCA: 27.75%</text>
    </g>

    <!-- Overall CAD HUD Card Floating over Heart -->
    <g transform="translate(-170, -280)" filter="url(#dropShadowCard)">
      <rect x="0" y="0" width="340" height="96" rx="18" fill="#090d16" stroke="#38bdf8" stroke-width="2" opacity="0.95" />
      <text x="24" y="32" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14" font-weight="700">OVERALL CAD PROBABILITY</text>
      <text x="24" y="72" fill="#ef4444" font-family="system-ui, sans-serif" font-size="38" font-weight="900">96.65%</text>
      <text x="180" y="70" fill="#f87171" font-family="monospace" font-size="14" font-weight="700">[88.7% - 99.0% CI]</text>
    </g>

    <!-- 4 Specialized Representation Modes Pill HUD -->
    <g transform="translate(-240, 420)">
      <rect x="0" y="0" width="480" height="54" rx="27" fill="#090d16" stroke="#334155" stroke-width="1.5" />
      <text x="22" y="34" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="15" font-weight="800">
        🫀 3D Beating  |  ⚙️ Procedural  |  📊 2D  |  🎬 Blender
      </text>
    </g>
  </g>

  <!-- Bottom Brand Watermark -->
  <g transform="translate(80, 1025)">
    <text x="0" y="0" fill="#475569" font-family="system-ui, sans-serif" font-size="16" font-weight="600">
      CardioVision © 2026 Team Lv. 9 • Track A: Multimodal AI Hackathon • CC-BY-4.0 Z-Alizadeh Sani Extension
    </text>
  </g>
</svg>
